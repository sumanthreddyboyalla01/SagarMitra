version: '3.8'

services:
  db:
    build: ./db
    container_name: sagarmitra-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sagarmitra
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: sagarmitra-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  db_data:
